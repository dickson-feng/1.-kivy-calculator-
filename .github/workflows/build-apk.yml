name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Increase swap memory
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo dd if=/dev/zero of=/swapfile bs=1G count=6
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libpng-dev libfreetype6-dev libssl-dev

    - name: Install buildozer & python-for-android
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK
      id: build_apk
      continue-on-error: true
      run: |
        buildozer android debug > build_log.txt 2>&1
        ls -la bin/

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log-file
        path: build_log.txt

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: bin/*.apk
